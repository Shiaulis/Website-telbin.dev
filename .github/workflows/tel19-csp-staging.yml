# TEMPORARY (TEL-19): test the Content-Security-Policy on the real Hostinger server, in a real
# browser, inside an isolated subfolder before it goes live. Deleted again before review.
name: TEL-19 CSP staging test

on:
  push:
    branches:
      - shiaulis/tel-19-content-security-policy

permissions:
  contents: read

concurrency:
  group: tel19-csp-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build

      - name: Adjust root-relative .htaccess paths for the staging subfolder
        # Same as TEL-11: only the anchored _astro prefix and the ErrorDocument path change.
        # The HTML is left byte-for-byte as production builds it; its /_astro/... references
        # resolve to the identical, already-live files at the site root (same content hashes).
        run: |
          sed -i 's|\^/_astro/|^/_csp-staging/_astro/|; s|^ErrorDocument 404 /404.html$|ErrorDocument 404 /_csp-staging/404.html|' dist/.htaccess
          grep -q '\^/_csp-staging/_astro/' dist/.htaccess
          grep -q '^ErrorDocument 404 /_csp-staging/404.html$' dist/.htaccess
          cat dist/.htaccess
          for p in $(grep -ohE '/_astro/[^"'"'"' )]+' $(find dist -name '*.html') | sort -u); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://telbin.dev$p")"
            echo "$code $p"; [ "$code" = 200 ] || { echo "asset missing on live root"; exit 1; }
          done

      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium firefox webkit

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)
          (umask 077; printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts)

      - name: Upload to staging subfolder only (no --delete)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          [ -n "$SSH_TARGET_DIR" ] || { echo "SSH_TARGET_DIR is empty"; exit 1; }
          STAGING="${SSH_TARGET_DIR%/}/_csp-staging"
          case "$STAGING" in */_csp-staging) ;; *) echo "bad staging path"; exit 1 ;; esac
          rsync -rlcz --chmod=D755,F644 --itemize-changes \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$STAGING/"

      - name: Check CSP headers with curl
        run: |
          CB="cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BASE="https://telbin.dev/_csp-staging"
          FAIL=0
          for u in "$BASE/?$CB" "$BASE/rss.xml?$CB" "$BASE/does-not-exist-$CB/" "$BASE/favicon.svg?$CB"; do
            echo "=== $u"
            curl -sS -o /dev/null -D /tmp/h.txt "$u" || true
            head -n 1 /tmp/h.txt
            grep -iE '^(content-security-policy|x-frame-options|server):' /tmp/h.txt || true
            grep -qi "^content-security-policy: frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" /tmp/h.txt || { echo "MISSING our CSP header"; FAIL=1; }
            echo
          done
          exit $FAIL

      - name: Browser test (Chromium, Firefox, WebKit; light and dark)
        env:
          BASE: https://telbin.dev/_csp-staging
        run: |
          cat > "$RUNNER_TEMP/pw/csp-test.mjs" <<'EOF'
          import { chromium, firefox, webkit } from 'playwright';

          const BASE = process.env.BASE;
          const CB = `cb=${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const PAGES = [
            { name: 'home', path: '/', contact: true, getInTouch: true },
            { name: 'about', path: '/about/', contact: true },
            { name: 'blog index', path: '/blog/', contact: true },
            { name: 'blog post', path: '/blog/finally-finishing-my-website/', contact: true },
            { name: 'blog post 2', path: '/blog/exploring-astro-claude-code/', contact: true },
            { name: 'rss.xml', path: '/rss.xml', xml: true },
            { name: '404', path: `/does-not-exist-${Date.now()}/`, status: 404, contact: true },
            { name: 'ipad-cases', path: '/ipad-cases/', images: true },
          ];
          const failures = [];
          const fail = (msg) => { failures.push(msg); console.log(`  FAIL: ${msg}`); };

          for (const [bname, btype] of [['chromium', chromium], ['firefox', firefox], ['webkit', webkit]]) {
            const browser = await btype.launch();
            for (const colorScheme of ['light', 'dark']) {
              const context = await browser.newContext({ colorScheme });
              await context.addInitScript(() => {
                window.__cspv = [];
                document.addEventListener('securitypolicyviolation', (e) => {
                  window.__cspv.push({ directive: e.violatedDirective, blocked: e.blockedURI, sample: e.sample, line: e.lineNumber });
                }, true);
              });
              for (const p of PAGES) {
                const tag = `[${bname}/${colorScheme}] ${p.name}`;
                const page = await context.newPage();
                const consoleErrors = [];
                const imageResponses = [];
                page.on('response', (r) => { if (r.request().resourceType() === 'image' && !r.url().startsWith(new URL(BASE).origin)) imageResponses.push(`${r.status()} ${r.url()}`); });
                page.on('requestfailed', (r) => consoleErrors.push(`requestfailed: ${r.url()} ${r.failure()?.errorText}`));
                page.on('console', (m) => {
                  // The 404 page's own document status is logged as a resource error by Chromium; that is expected.
                  if (p.status === 404 && /\b404\b/.test(m.text()) && !/content.security|csp/i.test(m.text())) return;
                  if (m.type() === 'error' || /content.security|csp/i.test(m.text())) consoleErrors.push(`${m.type()}: ${m.text()}`);
                });
                page.on('pageerror', (e) => consoleErrors.push(`pageerror: ${e.message}`));
                const url = `${BASE}${p.path}${p.path.includes('?') ? '&' : '?'}${CB}`;
                let res;
                try { res = await page.goto(url, { waitUntil: 'load' }); } catch (e) { fail(`${tag}: navigation failed: ${e.message}`); await page.close(); continue; }
                await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {});
                const status = res?.status();
                const info = { status };
                if ((p.status ?? 200) !== status) fail(`${tag}: status ${status}`);

                if (!p.xml) {
                  info.metaCsp = await page.evaluate(() => !!document.querySelector('meta[http-equiv="content-security-policy"]'));
                  if (!info.metaCsp) fail(`${tag}: no <meta> CSP`);
                  info.fonts = await page.evaluate(async () => {
                    await document.fonts.ready;
                    return [...new Set([...document.fonts].filter((f) => f.status === 'loaded').map((f) => f.family.replace(/"/g, '')))];
                  });
                  if (!info.fonts.some((f) => f.startsWith('Plus Jakarta Sans'))) fail(`${tag}: Plus Jakarta Sans not loaded (${info.fonts})`);
                  info.bodyFont = await page.evaluate(() => getComputedStyle(document.body).fontFamily.split(',')[0]);
                  info.bg = await page.evaluate(() => getComputedStyle(document.body).backgroundColor);
                  info.stylesheetRules = await page.evaluate(() => [...document.styleSheets].reduce((n, s) => { try { return n + s.cssRules.length; } catch { return n; } }, 0));
                  if (info.stylesheetRules < 50) fail(`${tag}: stylesheets look missing (${info.stylesheetRules} rules)`);
                }
                if (p.images) {
                  await page.evaluate(async () => {
                    const timeout = () => new Promise((r) => setTimeout(r, 15000));
                    await Promise.all([...document.images].map((img) => { img.loading = 'eager'; img.scrollIntoView(); return Promise.race([img.decode().catch(() => {}), timeout()]); }));
                  });
                  await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
                  info.images = await page.evaluate(() => [...document.images].map((i) => ({ src: i.currentSrc || i.src, ok: i.complete && i.naturalWidth > 0 })));
                  const external = info.images.filter((i) => !i.src.startsWith(new URL(BASE).origin));
                  info.externalImagesLoaded = `${external.filter((i) => i.ok).length}/${external.length}`;
                  info.externalImageResponses = imageResponses.map((r) => r.split(' ')[0]).join(',');
                  for (const i of info.images) if (!i.ok) fail(`${tag}: image did not load: ${i.src} (responses: ${imageResponses.filter((r) => r.endsWith(i.src)).join('; ') || 'none'})`);
                }
                if (p.contact) {
                  await page.evaluate(() => window.scrollTo(0, 0));
                  await page.click('#contact-trigger');
                  await page.waitForTimeout(300);
                  info.contactOpens = await page.evaluate(() => document.getElementById('contact-popover').matches(':popover-open'));
                  if (!info.contactOpens) fail(`${tag}: Contact popover did not open`);
                  await page.keyboard.press('Escape');
                  await page.waitForTimeout(200);
                }
                if (p.getInTouch) {
                  await page.click('a[data-contact-link]');
                  await page.waitForTimeout(1000);
                  info.getInTouchOpens = await page.evaluate(() => document.getElementById('contact-popover').matches(':popover-open'));
                  info.urlAfterGetInTouch = page.url().replace(/\?.*/, '');
                  if (!info.getInTouchOpens) fail(`${tag}: "Get in touch" did not open the popover`);
                }

                info.violations = await page.evaluate(() => window.__cspv ?? []).catch(() => ['<could not read>']);
                info.consoleErrors = consoleErrors;
                if (info.violations.length) fail(`${tag}: CSP violations ${JSON.stringify(info.violations)}`);
                if (consoleErrors.length) fail(`${tag}: console errors ${JSON.stringify(consoleErrors)}`);
                const { images, ...summary } = info;
                console.log(`${failures.some((f) => f.startsWith(tag)) ? 'FAIL' : 'ok  '} ${tag} ${JSON.stringify(summary)}`);
                await page.close();
              }
              await context.close();
            }
            await browser.close();
          }

          // frame-ancestors 'none': another origin must not be able to frame the site.
          {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const msgs = [];
            page.on('console', (m) => msgs.push(m.text()));
            await page.goto('data:text/html,<title>framer</title>');
            await page.setContent(`<iframe src="${BASE}/?${CB}"></iframe>`);
            await page.waitForTimeout(3000);
            const frameUrl = page.frames()[1]?.url() ?? '<no frame>';
            const blocked = msgs.find((m) => /frame-ancestors/.test(m));
            console.log(`${blocked ? 'ok  ' : 'FAIL'} [chromium] framing blocked by frame-ancestors: ${blocked ?? msgs.join(' | ')} (iframe url: ${frameUrl})`);
            if (!blocked) fail('framing was not blocked by frame-ancestors');
            await browser.close();
          }

          console.log(failures.length ? `\n${failures.length} failure(s)` : '\nALL PASSED: zero CSP violations, zero console errors');
          process.exit(failures.length ? 1 : 0);
          EOF
          cd "$RUNNER_TEMP/pw" && node csp-test.mjs

      - name: Remove staging subfolder
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          [ -f ~/.ssh/deploy_key ] || { echo "no SSH key, nothing uploaded"; exit 0; }
          [ -n "$SSH_TARGET_DIR" ] || { echo "SSH_TARGET_DIR is empty, refusing"; exit 1; }
          STAGING="${SSH_TARGET_DIR%/}/_csp-staging"
          case "$STAGING" in */_csp-staging) ;; *) echo "bad staging path, refusing"; exit 1 ;; esac
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "rm -rf -- $(printf '%q' "$STAGING") && echo removed staging folder"
          curl -s -o /dev/null -w 'after cleanup: %{http_code} https://telbin.dev/_csp-staging/\n' "https://telbin.dev/_csp-staging/?cb=${GITHUB_RUN_ID}-gone"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
